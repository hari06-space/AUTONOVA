# Dynamic License Server External Configuration
# Commented domain automatically uses Primary JPA DataSource Repository
# autonoma.license.server.domain=boss.autonomasys.com

# Dynamic JDBC URL: Constructed dynamically using domain/ip, port, and database-name
autonoma.license.server.url=jdbc:sqlserver://${autonoma.license.server.domain}:1433;databaseName=AUTONOMA_LIVE;trustServerCertificate=true;sendStringParametersAsUnicode=true;responseBuffering=adaptive;sendTimeAsDateTime=false
autonoma.license.server.username=autonoma
autonoma.license.server.password=Autonomaboss@2026

# Driver & Circuit Breaker Retry Configuration
autonoma.license.server.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
autonoma.license.server.max-retries=1
autonoma.license.server.retry-delay-ms=300
autonoma.license.server.cache-ttl-minutes=10
autonoma.license.server.warning-days=30

