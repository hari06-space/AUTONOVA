# ==============================================================================
# BOS Intent Engine - Keyword Configuration
# intent-keywords.yml
#
# This file contains the keyword sets used by BosIntentEngine for deterministic
# intent classification. Loaded at startup and refreshable from DB admin UI.
#
# Format:
#   modules:
#     MODULE_KEY:
#       keywords: [list of English keywords]
#       synonyms: [Tamil, Hindi transliterations, abbreviations]
#       injection_blocked: true  # set on sensitive modules
#
# CRITICAL: This file is checked into source control.
# Do NOT add actual data (names, codes) here — only keywords/phrases.
# ==============================================================================

modules:

  PAYROLL:
    description: "Salary, payslip, compensation — most sensitive module"
    injection_blocked: true
    keywords:
      - salary
      - payroll
      - pay slip
      - payslip
      - ctc
      - gross pay
      - net pay
      - gross salary
      - net salary
      - compensation
      - remuneration
      - increment
      - salary hike
      - hike
      - bonus
      - incentive
      - deduction
      - pf
      - provident fund
      - esi
      - tax deduction
      - tds
      - loan
      - loan deduction
      - salary advance
      - advance salary
      - penalty
      - salary structure
