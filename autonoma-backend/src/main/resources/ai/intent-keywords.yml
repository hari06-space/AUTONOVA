# ==============================================================================
# Injection Detection Patterns
# These always result in INJECTION_ATTEMPT classification, regardless of context.
# ==============================================================================
injection_patterns:
  - "ignore previous"
  - "ignore all"
  - "ignore instructions"
  - "forget everything"
  - "forget above"
  - "override"
  - "jailbreak"
  - "disregard"
  - "developer mode"
  - "dev mode"
  - "god mode"
  - "system prompt"
  - "reveal prompt"
  - "print context"
  - "show context"
  - "you are now"
  - "pretend you are"
  - "act as"
  - "roleplay as"
  - "from now on you"
  - "bypass security"
  - "bypass permission"
  - "as an ai without"
  - "do anything now"
  - "dan prompt"
  - "[dan]"
  - "sudo"
  - "root access"
  - "admin access"
  - "i give you permission"
  - "i grant you"
