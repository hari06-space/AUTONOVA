# Server Configuration
spring.profiles.active=dev
server.port=8081
 
# SQL Server Configuration
# Credentials are provided via environment variables. See application.properties.example.
spring.datasource.databasename=${DB_NAME:AUTONOMA}
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=${spring.datasource.databasename};trustServerCertificate=true;sendStringParametersAsUnicode=true;responseBuffering=adaptive;sendTimeAsDateTime=false
spring.datasource.username=${DB_USERNAME:nutech}
spring.datasource.password=${DB_PASSWORD:nutech@2026}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.properties.hibernate.dialect=com.autonoma.erp.config.CustomSQLServerDialect
spring.jpa.properties.hibernate.id.get_generated_keys_error_if_no_rows_affected=false
 
# Fix: "A result set was generated for update" - SQL Server sends row-count result sets
# that interfere with Hibernate's getGeneratedKeys() for IDENTITY columns.
# SET NOCOUNT ON suppresses these extra result sets at the connection level.
spring.datasource.hikari.connection-init-sql=SET NOCOUNT ON
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=600000
# Pool sizing — prevents connection exhaustion under multi-user load
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_UNCOMMITTED
# Pool sizing for secondary DB
spring.secondary.datasource.hikari.maximum-pool-size=10
spring.secondary.datasource.hikari.minimum-idle=2
spring.secondary.datasource.hikari.connection-timeout=20000
spring.secondary.datasource.hikari.idle-timeout=300000
 
# Secondary datasource (ERPDb_NUTECH)
spring.secondary.datasource.url=${SECONDARY_DB_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=ERPDb_NUTECH;trustServerCertificate=true;sendStringParametersAsUnicode=true;responseBuffering=adaptive;sendTimeAsDateTime=false}
spring.secondary.datasource.username=${spring.datasource.username}
spring.secondary.datasource.password=${DB_PASSWORD:nutech@2026}
spring.secondary.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
 
# Flyway Configuration
spring.flyway.enabled=false

# Externalized Enterprise License Server Configuration Import
spring.config.import=optional:classpath:license-server-config.properties
 
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=none
# !! PERFORMANCE: SQL logging disabled – was printing every query to stdout (massive overhead in production)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
# SQL errors are still logged via the SqlExceptionHelper below
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
 
# JWT Configuration (Secret must be at least 256 bits, supplied via env var)
jwt.secret=${JWT_SECRET:9a4f2c8d3e1f5b7a6c9d8e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0}
jwt.expiration=${JWT_EXPIRATION:86400000}
 
# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
 
# Swagger / OpenAPI Configuration
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
 
# Do not leak exception messages/stack details to API clients in production.
server.error.include-message=${ERROR_INCLUDE_MESSAGE:never}
server.error.include-stacktrace=never
 
# ==============================|| LOGGING CONFIGURATION ||==============================
 
# Suppress routine Hibernate SQL query output (SELECT / INSERT / UPDATE / DELETE)
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
 
# Keep SQL ERRORS visible (missing column, missing table, constraint violations, etc.)
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR
 
# Keep JPA / Spring Data errors visible
logging.level.org.springframework.orm.jpa=ERROR
logging.level.org.springframework.dao=ERROR
 
# Keep Spring MVC exception resolver visible (shows resolved exceptions per endpoint)
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR
 
# Keep all application-level runtime errors and exceptions visible
logging.level.org.springframework=ERROR
logging.level.com.autonoma.erp=ERROR
# ==============================|| SMTP MAIL CONFIGURATION ||==============================
# Configure either by editing these properties directly or via environment variables.
# Supports both SMTP_* (for IIS/production) and MAIL_* (for Gmail/dev) env variables.
spring.mail.host=${SMTP_HOST:${MAIL_HOST:localhost}}
spring.mail.port=${SMTP_PORT:${MAIL_PORT:587}}
spring.mail.username=${SMTP_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SMTP_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:${MAIL_AUTH:false}}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:${MAIL_TLS:false}}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_TLS_REQUIRED:${MAIL_TLS_REQUIRED:false}}
spring.mail.properties.mail.smtp.connectiontimeout=500
spring.mail.properties.mail.smtp.timeout=500
spring.mail.properties.mail.smtp.writetimeout=500
spring.mail.properties.mail.debug=false
mail.from.address=${SMTP_FROM:${MAIL_FROM:hr@nutechwindparts.com}}
 
groq.api.key=${GROQ_API_KEY:mock_groq_api_key_placeholder}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.timeout.seconds=20
gemini.api.key=${GEMINI_API_KEY:mock_gemini_api_key_placeholder}
gemini.model=gemini-flash-latest

# Local Self-Hosted LLM Configuration (Ollama)
ollama.enabled=false
ollama.url=${OLLAMA_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3}
ollama.auto-pull=${OLLAMA_AUTO_PULL:false}
ollama.timeout.seconds=${OLLAMA_TIMEOUT:30}

# ==============================|| AUTONOMA AI CONFIGURATION ||==============================
# AI conversation history retention (per user session)
ai.conversation.max.history=20
# Maximum rows returned per AI data query
ai.query.max.results=50
 
# ==============================|| PRODUCTION PERFORMANCE OPTIMIZATIONS ||==============================
# Enable HTTP Response GZIP Compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024
 
# HTTP/2 — multiplexes multiple API requests over a single TCP connection.
# Critical on high-latency / low-bandwidth connections (10 kbps): reduces
# the per-request handshake cost and enables header compression (HPACK).
# Requires HTTPS in production (Tomcat embeds support HTTP/2 over TLS).
server.http2.enabled=true
 
# Tomcat thread pool – handle more concurrent requests without queuing
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000
 
# HTTP/1.1 Keep-Alive – reuse TCP connections across API calls
server.tomcat.keep-alive-timeout=30000
server.tomcat.max-keep-alive-requests=200
 
# JDBC Batching and Hibernate Batch Fetching
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=16
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=false
 
 
# ==============================|| JACKSON SERIALIZATION ||==============================
# Prevents ByteBuddyInterceptor crash when Jackson serializes uninitialised Hibernate
# LAZY proxies (org.hibernate.proxy.pojo.bytebuddy.ByteBuddyInterceptor error).
spring.jackson.serialization.fail-on-empty-beans=false
# ==============================|| ESSL MULTI-TENANT MIGRATION ||==============================
# Set essl.migration.enabled=true to run scheduled sync for all configured clients
essl.migration.enabled=false
essl.migration.cron=0 0 2 * * *
essl.migration.zone=Asia/Kolkata
 
# Suppress null fields from JSON responses for cleaner API output
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.accept-empty-string-as-null-object=true
spring.jackson.deserialization.accept-empty-array-as-null-object=true
 
 
 
# Tertiary datasource (ESSL database)
essl.datasource.url=${ESSL_DB_URL:jdbc:sqlserver://192.168.1.121:1433;databaseName=NT_ESSL;trustServerCertificate=true;sendStringParametersAsUnicode=true;responseBuffering=adaptive;sendTimeAsDateTime=false}
essl.datasource.username=${ESSL_DB_USER:nutech}
essl.datasource.password=${ESSL_DB_PASSWORD:nutech@2026}
essl.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
 
# Enable detailed actuator health for debugging
management.endpoint.health.show-details=always
management.health.mail.enabled=false
 
# ==============================|| CACHING (Caffeine) ||==============================
# In-memory cache for static/rarely-changing data (designations, departments, page-permissions, etc.)
# Cache definitions are in CacheConfig.java with per-cache TTL and size settings.
spring.cache.type=caffeine

# Email Control Settings
# If true, only candidate/recruitment email notifications from ATS are permitted to go out.
email.only-ats-enabled=true

# Security Configuration for OCR Secrets Encryption
app.security.encryption-key=placeholder_key_must_be_32_chars_long

# Quartz Scheduler Configuration
spring.quartz.startup-delay=0s
spring.quartz.job-store-type=memory
spring.quartz.overwrite-existing-jobs=true
spring.quartz.properties.org.quartz.scheduler.skipUpdateCheck=true
spring.quartz.properties.org.quartz.threadPool.class=org.quartz.simpl.SimpleThreadPool
spring.quartz.properties.org.quartz.threadPool.threadCount=5
spring.quartz.properties.org.quartz.scheduler.makeSchedulerThreadDaemon=true

# Embedded Python Document Search Configuration
document.search.python.enabled=${DOC_SEARCH_PYTHON_ENABLED:true}
document.search.python.executable=${DOC_SEARCH_PYTHON_EXEC:C:/Users/Admin/AppData/Local/Python/pythoncore-3.14-64/python.exe}
document.search.python.script=${DOC_SEARCH_SCRIPT_PATH:scripts/doc_indexer.py}
document.search.storage.root=${BOS_DOCUMENTS_DIR:${DOC_STORAGE_ROOT:D:/BOS_DOCUMENTS}}
document.search.index.path=${DOC_SEARCH_INDEX_PATH:${document.search.storage.root}/.search_index/doc_search.db}
document.search.worker.enabled=${DOC_SEARCH_WORKER_ENABLED:true}
document.search.worker.batch-size=${DOC_SEARCH_BATCH_SIZE:10}
document.search.worker.poll-interval-ms=${DOC_SEARCH_POLL_INTERVAL_MS:15000}



