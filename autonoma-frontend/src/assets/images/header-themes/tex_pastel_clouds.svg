<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 90" preserveAspectRatio="none">
  <defs>
    <!-- Base Sky Canvas Gradient -->
    <linearGradient id="sky_base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="65%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>

    <!-- Rich Cerulean Sky Cloud Gradient -->
    <radialGradient id="blue_cloud" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="75%" stop-color="#bae6fd" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Golden Apricot Sunset Cloud -->
    <radialGradient id="apricot_cloud" cx="80%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0"/>
    </radialGradient>

    <!-- Central Rose Blush Mist -->
    <radialGradient id="rose_mist" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#fb7185" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#fbcfe8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fff1f2" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft_cloud_blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- 1. Background Base Sky Wash -->
  <rect width="1440" height="90" fill="url(#sky_base)"/>

  <!-- 2. Rich Watercolor Cloud Formations -->
  <ellipse cx="220" cy="45" rx="300" ry="70" fill="url(#blue_cloud)" filter="url(#soft_cloud_blur)"/>
  <ellipse cx="720" cy="50" rx="320" ry="65" fill="url(#rose_mist)" filter="url(#soft_cloud_blur)"/>
  <ellipse cx="1200" cy="40" rx="340" ry="75" fill="url(#apricot_cloud)" filter="url(#soft_cloud_blur)"/>

  <!-- Crisp Organic Cloud Puffs / Billows -->
  <g opacity="0.65" filter="url(#soft_cloud_blur)">
    <circle cx="100" cy="25" r="45" fill="#38bdf8"/>
    <circle cx="180" cy="35" r="55" fill="#bae6fd"/>
    <circle cx="270" cy="20" r="40" fill="#7dd3fc"/>
    <circle cx="650" cy="35" r="50" fill="#f472b6"/>
    <circle cx="740" cy="25" r="60" fill="#fbcfe8"/>
    <circle cx="830" cy="40" r="45" fill="#fda4af"/>
    <circle cx="1120" cy="30" r="55" fill="#fb923c"/>
    <circle cx="1220" cy="20" r="65" fill="#fde047"/>
    <circle cx="1330" cy="35" r="50" fill="#f97316"/>
  </g>

  <!-- Accent Border -->
  <line x1="0" y1="90" x2="1440" y2="90" stroke="#fb923c" stroke-width="1.8"/>
</svg>
