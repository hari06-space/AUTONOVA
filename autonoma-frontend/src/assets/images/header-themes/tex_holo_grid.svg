<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 90" preserveAspectRatio="none">
  <defs>
    <!-- Rich Frosted Holographic Background -->
    <linearGradient id="holo_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="35%" stop-color="#ede9fe"/>
      <stop offset="65%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>

    <!-- Vivid Rainbow Holographic Sheen Wave -->
    <linearGradient id="holo_wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="25%" stop-color="#818cf8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="75%" stop-color="#f472b6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.65"/>
    </linearGradient>

    <filter id="holo_blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Clean Base -->
  <rect width="1440" height="90" fill="url(#holo_bg)"/>

  <!-- Flowing Holographic Spectral Aurora Sheen -->
  <path d="M0 45 C 280 10, 560 80, 860 25 C 1140 -15, 1340 65, 1440 30 L 1440 90 L 0 90 Z" fill="url(#holo_wave)" filter="url(#holo_blur)"/>

  <!-- Precision Cyber Isometric / Diagonal Laser Grid Lines (45 degree angles) -->
  <g stroke="#6366f1" stroke-width="2.2" opacity="0.6">
    <!-- Positive Diagonals -->
    <line x1="0" y1="0" x2="90" y2="90"/>
    <line x1="100" y1="0" x2="190" y2="90"/>
    <line x1="200" y1="0" x2="290" y2="90"/>
    <line x1="300" y1="0" x2="390" y2="90"/>
    <line x1="400" y1="0" x2="490" y2="90"/>
    <line x1="500" y1="0" x2="590" y2="90"/>
    <line x1="600" y1="0" x2="690" y2="90"/>
    <line x1="700" y1="0" x2="790" y2="90"/>
    <line x1="800" y1="0" x2="890" y2="90"/>
    <line x1="900" y1="0" x2="990" y2="90"/>
    <line x1="1000" y1="0" x2="1090" y2="90"/>
    <line x1="1100" y1="0" x2="1190" y2="90"/>
    <line x1="1200" y1="0" x2="1290" y2="90"/>
    <line x1="1300" y1="0" x2="1390" y2="90"/>
    <line x1="1400" y1="0" x2="1440" y2="40"/>

    <!-- Negative Diagonals -->
    <line x1="90" y1="0" x2="0" y2="90"/>
    <line x1="190" y1="0" x2="100" y2="90"/>
    <line x1="290" y1="0" x2="200" y2="90"/>
    <line x1="390" y1="0" x2="300" y2="90"/>
    <line x1="490" y1="0" x2="400" y2="90"/>
    <line x1="590" y1="0" x2="500" y2="90"/>
    <line x1="690" y1="0" x2="600" y2="90"/>
    <line x1="790" y1="0" x2="700" y2="90"/>
    <line x1="890" y1="0" x2="800" y2="90"/>
    <line x1="990" y1="0" x2="900" y2="90"/>
    <line x1="1090" y1="0" x2="1000" y2="90"/>
    <line x1="1190" y1="0" x2="1100" y2="90"/>
    <line x1="1290" y1="0" x2="1200" y2="90"/>
    <line x1="1390" y1="0" x2="1300" y2="90"/>
  </g>

  <!-- Glowing Laser Crosshair Points at Intersections -->
  <g fill="#9333ea" opacity="0.85">
    <circle cx="145" cy="45" r="3.5"/><circle cx="345" cy="45" r="3.5"/>
    <circle cx="545" cy="45" r="3.5"/><circle cx="745" cy="45" r="3.5"/>
    <circle cx="945" cy="45" r="3.5"/><circle cx="1145" cy="45" r="3.5"/>
    <circle cx="1345" cy="45" r="3.5"/>
  </g>

  <!-- Holographic Laser Edge on Bottom -->
  <line x1="0" y1="90" x2="1440" y2="90" stroke="#7c3aed" stroke-width="2.5"/>
</svg>
