<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 90" preserveAspectRatio="none">
  <defs>
    <!-- Facet Gradients -->
    <linearGradient id="facet_a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="facet_b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="facet_c" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="facet_d" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="100%" stop-color="#fdf4ff"/>
    </linearGradient>
    <linearGradient id="facet_e" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="facet_f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Continuous Low-Poly Origami Prism Facets Across 1440px -->
  <polygon points="0,0 120,45 0,90" fill="url(#facet_a)"/>
  <polygon points="0,0 180,0 120,45" fill="url(#facet_b)"/>
  <polygon points="180,0 290,38 120,45" fill="url(#facet_c)"/>
  <polygon points="120,45 290,38 210,90" fill="url(#facet_d)"/>
  <polygon points="0,90 120,45 210,90" fill="url(#facet_e)"/>

  <polygon points="180,0 360,0 290,38" fill="url(#facet_a)"/>
  <polygon points="360,0 470,42 290,38" fill="url(#facet_b)"/>
  <polygon points="290,38 470,42 380,90" fill="url(#facet_c)"/>
  <polygon points="210,90 290,38 380,90" fill="url(#facet_f)"/>

  <polygon points="360,0 540,0 470,42" fill="url(#facet_d)"/>
  <polygon points="540,0 660,36 470,42" fill="url(#facet_a)"/>
  <polygon points="470,42 660,36 570,90" fill="url(#facet_e)"/>
  <polygon points="380,90 470,42 570,90" fill="url(#facet_b)"/>

  <polygon points="540,0 720,0 660,36" fill="url(#facet_c)"/>
  <polygon points="720,0 840,40 660,36" fill="url(#facet_d)"/>
  <polygon points="660,36 840,40 750,90" fill="url(#facet_a)"/>
  <polygon points="570,90 660,36 750,90" fill="url(#facet_f)"/>

  <polygon points="720,0 900,0 840,40" fill="url(#facet_b)"/>
  <polygon points="900,0 1020,38 840,40" fill="url(#facet_c)"/>
  <polygon points="840,40 1020,38 930,90" fill="url(#facet_e)"/>
  <polygon points="750,90 840,40 930,90" fill="url(#facet_d)"/>

  <polygon points="900,0 1080,0 1020,38" fill="url(#facet_a)"/>
  <polygon points="1080,0 1200,42 1020,38" fill="url(#facet_b)"/>
  <polygon points="1020,38 1200,42 1110,90" fill="url(#facet_c)"/>
  <polygon points="930,90 1020,38 1110,90" fill="url(#facet_f)"/>

  <polygon points="1080,0 1260,0 1200,42" fill="url(#facet_d)"/>
  <polygon points="1260,0 1370,36 1200,42" fill="url(#facet_a)"/>
  <polygon points="1200,42 1370,36 1290,90" fill="url(#facet_e)"/>
  <polygon points="1110,90 1200,42 1290,90" fill="url(#facet_b)"/>

  <polygon points="1260,0 1440,0 1370,36" fill="url(#facet_c)"/>
  <polygon points="1370,36 1440,50 1440,0" fill="url(#facet_d)"/>
  <polygon points="1370,36 1440,90 1440,50" fill="url(#facet_a)"/>
  <polygon points="1290,90 1370,36 1440,90" fill="url(#facet_f)"/>

  <!-- Fold Ridge Highlight Overlay Lines -->
  <g stroke="#ffffff" stroke-width="1.6" opacity="0.85">
    <line x1="0" y1="0" x2="120" y2="45"/><line x1="120" y1="45" x2="210" y2="90"/>
    <line x1="180" y1="0" x2="290" y2="38"/><line x1="290" y1="38" x2="380" y2="90"/>
    <line x1="360" y1="0" x2="470" y2="42"/><line x1="470" y1="42" x2="570" y2="90"/>
    <line x1="540" y1="0" x2="660" y2="36"/><line x1="660" y1="36" x2="750" y2="90"/>
    <line x1="720" y1="0" x2="840" y2="40"/><line x1="840" y1="40" x2="930" y2="90"/>
    <line x1="900" y1="0" x2="1020" y2="38"/><line x1="1020" y1="38" x2="1110" y2="90"/>
    <line x1="1080" y1="0" x2="1200" y2="42"/><line x1="1200" y1="42" x2="1290" y2="90"/>
    <line x1="1260" y1="0" x2="1370" y2="36"/><line x1="1370" y1="36" x2="1440" y2="90"/>
  </g>

  <!-- Bottom Border -->
  <line x1="0" y1="90" x2="1440" y2="90" stroke="#c7d2fe" stroke-width="2"/>
</svg>
